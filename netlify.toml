[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled function: runs every minute to evaluate intervals and active windows
[functions."cron-scheduler"]
  schedule = "* * * * *"

# Redirect API calls locally or on Netlify if needed
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page App rewrite for client-side routing if required
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
